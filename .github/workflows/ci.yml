name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simhaq
          POSTGRES_PASSWORD: simhaq
          POSTGRES_DB: simhaq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simhaq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://simhaq:simhaq@localhost:5432/simhaq?sslmode=disable
      AUTH_SECRET: ci-secret-for-simhaq-testing-0123456789abcdef
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun skema basis data
        run: |
          npx prisma generate
          npx prisma db push

      - name: Isi data contoh
        run: npm run db:seed

      - name: Periksa lint
        run: npm run lint

      - name: Periksa tipe
        run: npx tsc --noEmit

      - name: Build produksi
        run: npm run build

      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium

      # Dijalankan di atas hasil build di atas (next start), bukan next dev.
      - name: Jalankan pengujian e2e
        run: npx playwright test

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
